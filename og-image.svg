<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#060912"/>

  <!-- Grid lines (subtle) -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="black" stop-opacity="0"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- Accent dot (mirroring logo) -->
  <circle cx="464" cy="218" r="14" fill="#93C5FD" opacity="0.9"/>

  <!-- SubWeb Logotype -->
  <text x="480" y="318" font-family="Arial, Helvetica, sans-serif" font-size="148" font-weight="900" fill="#FFFFFF" letter-spacing="-6">Sub</text>
  <text x="736" y="318" font-family="Arial, Helvetica, sans-serif" font-size="148" font-weight="300" fill="#93C5FD" letter-spacing="-6">web</text>

  <!-- Divider -->
  <rect x="480" y="344" width="240" height="1.5" fill="rgba(255,255,255,0.12)" rx="1"/>

  <!-- Tagline -->
  <text x="600" y="402" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="rgba(255,255,255,0.45)" text-anchor="middle" letter-spacing="1">학원 홈페이지 올인원 구독 서비스</text>

  <!-- Value prop pills -->
  <rect x="316" y="448" width="156" height="40" rx="20" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.35)" stroke-width="1"/>
  <text x="394" y="473" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="rgba(147,197,253,0.85)" text-anchor="middle">제작 · 배포</text>

  <rect x="492" y="448" width="100" height="40" rx="20" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.35)" stroke-width="1"/>
  <text x="542" y="473" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="rgba(147,197,253,0.85)" text-anchor="middle">운영</text>

  <rect x="612" y="448" width="156" height="40" rx="20" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.35)" stroke-width="1"/>
  <text x="690" y="473" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="rgba(147,197,253,0.85)" text-anchor="middle">월 업데이트</text>

  <rect x="788" y="448" width="100" height="40" rx="20" fill="rgba(251,191,36,0.15)" stroke="rgba(251,191,36,0.35)" stroke-width="1"/>
  <text x="838" y="473" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="rgba(251,191,36,0.85)" text-anchor="middle">연 19만원</text>
</svg>
